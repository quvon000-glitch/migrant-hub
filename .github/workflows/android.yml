name: Android APK

on:
  push:
    branches: [claude/salom-d769nb, main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK (one file for all phones)
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: migrant-hub-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # A release page gives a direct download link that opens on a phone
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Migrant Hub (test) #${{ github.run_number }}
          prerelease: true
          body: |
            Sinov versiyasi. Telefonda yuklab oling va o‘rnating
            (Sozlamalar → "Noma’lum manbalardan o‘rnatish"ga ruxsat bering).
          files: app/build/app/outputs/flutter-apk/app-release.apk
